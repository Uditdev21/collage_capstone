# Eclipse Mosquitto Configuration for Tasmota and IoT Devices

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Standard MQTT Listener for Tasmota / LAN devices
listener 1883 0.0.0.0
# Set to true for quick initial connection with Tasmota without authentication
allow_anonymous true

# WebSockets Listener (useful for browser clients / web dashboards)
listener 9001 0.0.0.0
protocol websockets

# Uncomment the line below if you configure a password file:
# password_file /mosquitto/config/passwd
